plugins {
	// fabric-loom-remap on an obfuscated Minecraft (1.21.11), fabric-loom on 26.x (settings.gradle).
	id 'dev.kikugie.loom-back-compat'
}

// This node's Minecraft band, and common's node for it.
def band = stonecutter.current.version
def common = ":common:${stonecutter.current.project}"
// The node's Java release (gradle.properties java_version): 1.21.11 players run Java 21, so its class files must
// load there. fabric.mod.json asks for the same.
def javaRelease = project.property("java_version.$band") as int

// Keeps `:fabric:26.2` a different module from `:common:26.2` (see common/build.gradle).
group = "${project.group}.fabric"

// commitment-<version>+fabric-mc<band label>.jar, and the matching sources jar. The mod's own version in
// fabric.mod.json stays plain.
base {
	archivesName = rootProject.name
}
def jarVersion = "${project.version}+fabric-mc${project.property("band_label.$band")}"
tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = jarVersion
}

repositories {
	// Loom adds the repositories for Minecraft, Fabric and their libraries automatically.
	// Only add one here when depending on another mod.
}

// common's sources and resources are compiled into this jar (see common/build.gradle), so there is
// one jar to ship.
configurations {
	commonJava {
		canBeResolved = true
		canBeConsumed = false
	}
	commonResources {
		canBeResolved = true
		canBeConsumed = false
	}
}

// One run root per loader and band, so a newer Minecraft never upgrades another node's worlds, and the client's
// saves never mix with the dev server's world. runDir is relative to the node's project dir.
def runRoot = rootProject.file("run/fabric/${band}")
// Stage E (TODO E.1a): a pack's run dir, always under run/packs/ (fail closed: anything else is refused).
def PACK_DRIVER = 'commitment.packDriver'
def packDir = providers.gradleProperty('commitment.packDir').map { rootProject.file(it).canonicalFile }.getOrNull()
if (packDir != null && !packDir.path.startsWith(rootProject.file('run/packs').canonicalPath + File.separator)) {
	throw new GradleException("commitment.packDir must be under run/packs/, not ${packDir}")
}

loom {
	mods {
		"commitment" {
			sourceSet sourceSets.main
		}
	}
	runs {
		client {
			runDir project.relativePath(new File(runRoot, "client"))
		}
		server {
			runDir project.relativePath(new File(runRoot, "server"))
			programArgs '--port', project.dev_server_port
		}
		// Every run, the GameTest ones included: development writes its lock mirrors here, never into the
		// developer's own user data dir (MirrorDir.OVERRIDE). A pack's go beside its game dir.
		configureEach {
			property 'commitment.mirrorDir', (name == 'packClient' ? new File(packDir, "mirror") : new File(runRoot, "mirror")).absolutePath
			// `-Pcommitment.unlock=start` (dev-server-smoke.sh's @gradle): the dedicated server's unlock flag (ServerGate).
			if (providers.gradleProperty('commitment.unlock').isPresent()) {
				property 'commitment.unlock', providers.gradleProperty('commitment.unlock').get()
			}
		}
	}
}

// The dev server refuses to start without eula.txt. Written only when absent: never overwrites a file someone set.
def serverEula = new File(runRoot, "server/eula.txt")
def acceptDevServerEula = tasks.register('acceptDevServerEula') {
	doLast {
		if (!serverEula.exists()) {
			serverEula.parentFile.mkdirs()
			serverEula.text = "eula=true\n"
			logger.lifecycle("Wrote ${serverEula} for the dev server")
		}
	}
}
tasks.named('runServer') {
	dependsOn acceptDevServerEula
}

fabricApi {
	// Adds the `gametest` source set and `runGameTest`, which `check` runs on a headless server
	// in <node>/build/run/gameTest. Loom keeps that directory and its world between runs: clearGameTestWorld, below.
	// `runClientGameTest` plays a singleplayer world on a real client. It needs a display, so
	// `check` leaves it out.
	configureTests {
		createSourceSet = true
		modId = "commitment-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true // Accepts the Minecraft EULA for the automated test server only.
	}
}

// Stage E's pack client (scripts/pack-smoke.sh): `-Pcommitment.packDir=<dir>` plays the pack in <dir>/game, with the
// GameTest mod's PackDriver (`-Pcommitment.packDriver=commit|reopen`) and Quick Play into the world it names. After
// configureTests, which makes the gametest source set; its mirror dir comes from loom.runs' configureEach, above.
if (packDir != null) {
	loom.runs {
		packClient {
			// client(), not `inherit client`: inheriting copies the client run's mirror dir, and the JVM kept that one.
			client()
			configName = "Pack Client"
			source sourceSets.gametest
			runDir project.relativePath(new File(packDir, "game"))
			property PACK_DRIVER, providers.gradleProperty(PACK_DRIVER).getOrElse('reopen')
			programArgs '--quickPlaySingleplayer', providers.gradleProperty('commitment.quickPlay').getOrElse('commitment-pack-smoke')
		}
	}
}

// A fresh GameTest world every run. Loom keeps the last run's (gotchas.md 2026-10-22), and CommandsGameTest commits
// it, which every later run would then inherit. Only <node>/build/run/gameTest/world and .../mirror (the GameTest
// server's lock mirrors, below) are ever deleted: each run creates them from nothing, so nothing in them is anyone's.
// eula.txt and mods/ beside them are Loom's, kept.
def buildRoot = layout.buildDirectory.get().asFile.canonicalFile
def gameTestState = ['world', 'mirror'].collect { new File(buildRoot, "run/gameTest/${it}").canonicalFile }
def clearGameTestWorld = tasks.register('clearGameTestWorld') {
	doLast {
		gameTestState.each { dir ->
			// Fail closed: a path that resolves anywhere else (a junction, a changed build dir) is refused.
			if (dir.parentFile != new File(buildRoot, 'run/gameTest').canonicalFile || !(dir.name in ['world', 'mirror'])) {
				throw new GradleException("Refusing to delete ${dir}: not ${buildRoot}/run/gameTest/world or mirror")
			}
			if (dir.exists()) {
				logger.lifecycle("Clearing the GameTest ${dir.name} ${dir} (rebuilt by every run)")
				if (!dir.deleteDir()) {
					throw new GradleException("Could not clear ${dir}; a server from the last run may still hold it")
				}
			}
		}
	}
}
tasks.matching { it.name == 'runGameTest' }.configureEach {
	dependsOn clearGameTestWorld
}
// The GameTest server keeps its lock mirrors beside its world, cleared with it: a test that fails midway never leaves
// one in run/fabric/<node>/mirror, where the dev-server smokes refuse to run over a leftover.
loom.runs.matching { it.name == 'gameTest' }.configureEach {
	property 'commitment.mirrorDir', new File(buildRoot, 'run/gameTest/mirror').absolutePath
}

// The server GameTests as Stonecutter wrote them for this node, for NeoForge's and Forge's GameTest mods of the same
// node (plan step C.0): they compile this directory with the one GameTest import swapped.
configurations {
	serverGameTestJava {
		canBeResolved = false
		canBeConsumed = true
	}
}
sourceSets.gametest.java.srcDirs.each { dir ->
	// Stonecutter generates each source set with its own task; stonecutterGenerate is main's only.
	artifacts.add('serverGameTestJava', dir) { builtBy tasks.named('stonecutterGenerateGametest') }
}
apply from: rootProject.file('gradle/gametest-report.gradle')

dependencies {
	// The node's band is the Minecraft version; the rest is per band in gradle.properties.
	minecraft "com.mojang:minecraft:${band}"
	// Mojang names on an obfuscated Minecraft; 26.x needs none. mod* remaps there and is plain on 26.x.
	loomx.applyMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.property("fabric_api_version.$band")}"

	// common's node for the same band. Compiled classes for IDEs only: the build compiles its sources, below.
	compileOnly project(common)
	commonJava project(path: common, configuration: 'commonJava')
	commonResources project(path: common, configuration: 'commonResources')

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('compileJava', JavaCompile) {
	dependsOn configurations.commonJava
	source configurations.commonJava
}

processResources {
	def version = project.version
	def minecraftRange = project.property("minecraft_range.$band")
	inputs.property "version", version
	inputs.property "minecraftRange", minecraftRange
	def release = javaRelease
	inputs.property "javaRelease", release

	from configurations.commonResources

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraftRange": minecraftRange, "javaRelease": release
	}
}

// The game-test mod declares the same version; left as ${version}, Fabric Loader warns on every test run.
tasks.named('processGametestResources', ProcessResources) {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaRelease)
	targetCompatibility = JavaVersion.toVersion(javaRelease)
}

tasks.named('sourcesJar', Jar) {
	dependsOn configurations.commonJava, configurations.commonResources
	from configurations.commonJava
	from configurations.commonResources
}

test {
	useJUnitPlatform()
	// ModMetadataTest reads the repo's LICENSE, ReadmeBandsTest its README and gradle.properties, ChangelogTest its
	// CHANGELOG; Gradle runs tests from the node's folder, not the repo root. They're inputs, so editing one alone
	// reruns the tests.
	systemProperty "commitment.repoRoot", rootDir.absolutePath
	inputs.files(rootProject.file("LICENSE"), rootProject.file("README.md"), rootProject.file("gradle.properties"),
			rootProject.file("CHANGELOG.md"))
		.withPropertyName("repoDocs").withPathSensitivity(PathSensitivity.RELATIVE)
	// GameTestSourcesTest reads the GameTest sources and their fabric.mod.json.
	inputs.dir(rootProject.file("fabric/src/gametest")).withPropertyName("gameTestSources")
		.withPathSensitivity(PathSensitivity.RELATIVE)
	// LoaderFloorTest reads the NeoForge and Forge mods.toml templates.
	inputs.files(rootProject.file("neoforge/src/main/resources/META-INF/neoforge.mods.toml"),
			rootProject.file("forge/src/main/resources/META-INF/mods.toml"))
		.withPropertyName("loaderTemplates").withPathSensitivity(PathSensitivity.RELATIVE)
	// BandLabelTest: the jar this node ships, and the Minecraft version it compiles against.
	systemProperty "commitment.jarName", loomx.modJar.get().archiveFileName.get()
	systemProperty "commitment.minecraft", band
	testLogging {
		events = ["passed", "skipped", "failed"]
		exceptionFormat = "full"
	}
}
