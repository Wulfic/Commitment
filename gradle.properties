# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Acknowledges Stonecutter's notice that it prefers Kotlin build scripts. Ours stay Groovy, like the rest.
dev.kikugie.stonecutter.hard_mode=true

# Fabric Properties - pinned 2026-10-21 from meta.fabricmc.net and maven.fabricmc.net. Never bump from memory.
# loader: the newest stable (0.20.x has no stable build yet); it runs 1.21.11 too. loom: 26.x ships unobfuscated
# (net.fabricmc.fabric-loom, no mappings), 1.21.11 doesn't (net.fabricmc.fabric-loom-remap + Mojang mappings);
# loom-back-compat (settings.gradle) applies the right one at this version. 1.19.2 exists; 1.18.4 + Gradle 9.7.1 is
# the pair proven in ../the-continent and, with 1.21.11, ../enchanting-2 (decisions.md 2026-10-21).
loader_version=0.19.5
loomx.loom_version=1.18.4

# Per band. A band is a Stonecutter node (settings.gradle), named after the Minecraft version it compiles
# against. fabric_api: the newest build for that version. minecraft_range: what the jar declares it runs on.
# band_label: the band in the jar's name (commitment-<version>+fabric-mc<label>.jar). BandLabelTest holds
# the label and the range to each other. java_version: the class files' Java release (1.21.11 runs on Java 21,
# piston-meta javaVersion; 26.x on 25).
# 1.21.11, Fabric only (owner, decisions.md 2026-10-22): Fabric API pinned 2026-10-22 from maven-metadata.
fabric_api_version.1.21.11=0.141.6+1.21.11
minecraft_range.1.21.11=>=1.21.11 <1.21.12
band_label.1.21.11=1.21.11
java_version.1.21.11=21
java_version.26.1.2=25
java_version.26.2=25
java_version.26.3=25
fabric_api_version.26.1.2=0.155.3+26.1.2
minecraft_range.26.1.2=>=26.1 <26.2
band_label.26.1.2=26.1
fabric_api_version.26.2=0.161.0+26.2
minecraft_range.26.2=>=26.2 <26.3
band_label.26.2=26.2
fabric_api_version.26.3=0.164.0+26.3
minecraft_range.26.3=>=26.3 <26.4
band_label.26.3=26.3

# NeoForge - pinned 2026-10-21 from maven.neoforged.net. NeoForge has no stable build for 26.1 or 26.1.1, so its
# 26.1 jar runs on 26.1.2 alone, and is labelled so.
moddev_version=2.0.148
neoforge_version.26.1.2=26.1.2.122
neoforge_minecraft_range.26.1.2=[26.1.2,26.2)
neoforge_band_label.26.1.2=26.1.2
neoforge_version.26.2=26.2.0.93
neoforge_minecraft_range.26.2=[26.2,26.3)
neoforge_band_label.26.2=26.2
neoforge_version.26.3=26.3.0.95
neoforge_minecraft_range.26.3=[26.3,26.4)
neoforge_band_label.26.3=26.3
# The mods.toml key for the mod-list icon, read from each pinned universal jar 2026-10-26: 26.1.2.122 knows only
# logoFile; 26.2.0.93 and 26.3.0.95 read iconFile (square) and warn on logoFile, which puts a warnings screen in front
# of every launch.
neoforge_icon_key.26.1.2=logoFile
neoforge_icon_key.26.2=iconFile
neoforge_icon_key.26.3=iconFile
# The lowest NeoForge each jar declares (neoforge.mods.toml), below the pin it compiles against so a pack doesn't have to
# update its loader (decisions.md 2026-10-28). Each one is proven on that build (TODO F.0); LoaderFloorTest holds it at
# or below the pin, on the pin's line. Builds listed from maven.neoforged.net's maven-metadata.xml 2026-10-28.
neoforge_floor.26.1.2=26.1.2.71
neoforge_floor.26.2=26.2.0.57
neoforge_floor.26.3=26.3.0.51-beta

# Forge - pinned 2026-10-21 from files.minecraftforge.net promotions_slim.json (the recommended build of each) and
# the Gradle Plugin Portal. Forge publishes one major per Minecraft release, so its 26.1 jar runs on 26.1.2 alone,
# and is labelled so. Forge loads a mod's data only with a pack.mcmeta; forge_pack_format is the band's data pack
# major (version.json in its Minecraft jar).
forgegradle_version=7.0.40
forge_version.26.1.2=64.1.5
forge_minecraft_range.26.1.2=[26.1.2,26.2)
forge_band_label.26.1.2=26.1.2
forge_pack_format.26.1.2=101
forge_version.26.2=65.1.5
forge_minecraft_range.26.2=[26.2,26.3)
forge_band_label.26.2=26.2
forge_pack_format.26.2=107
forge_version.26.3=66.1.0
forge_minecraft_range.26.3=[26.3,26.4)
forge_band_label.26.3=26.3
forge_pack_format.26.3=121
# The lowest Forge each jar declares (mods.toml), as neoforge_floor above. Builds listed from maven.minecraftforge.net's
# maven-metadata.xml 2026-10-28.
forge_floor.26.1.2=64.0.0
forge_floor.26.2=65.0.0
forge_floor.26.3=66.0.0

# Real-server smoke: each band's jars boot on a real server of the band's floor version. smoke_floor: the lowest
# Minecraft the band's Fabric jar declares. smoke_fabric_api: the newest Fabric API for that floor (26.1.2's
# Fabric API won't load on 26.1). quilt_loader: Quilt runs the Fabric jar; it has only betas (meta.quiltmc.org).
smoke_floor.1.21.11=1.21.11
smoke_fabric_api.1.21.11=0.141.6+1.21.11
smoke_floor.26.1.2=26.1
smoke_fabric_api.26.1.2=0.145.1+26.1
smoke_floor.26.2=26.2
smoke_fabric_api.26.2=0.161.0+26.2
smoke_floor.26.3=26.3
smoke_fabric_api.26.3=0.164.0+26.3
quilt_loader_version=0.31.0-beta.4
# The Quilt installer (meta.quiltmc.org/v3/versions/installer, 2026-10-27): installs the Quilt server for D.1 and F.2.
quilt_installer_version=0.15.1

# Dev server: its own port, so it never meets the owner's server (25565) or another repo's (25566, 25567, 25575,
# 25577, 25599 are taken). Each loader node runs in run/<loader>/<band>/{server,client}.
dev_server_port=25571

# Mod Properties
version=0.1.0
group=com.wulfic.commitment

# Dependencies
junit_version=5.14.4
