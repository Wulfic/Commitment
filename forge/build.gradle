plugins {
	id 'net.minecraftforge.gradle'
}

// This node's Minecraft band, and common's node for it.
def band = stonecutter.current.version
def common = ":common:${stonecutter.current.project}"
def forgeVersion = project.property("forge_version.$band")

// Keeps `:forge:26.2` a different module from `:common:26.2` (see common/build.gradle).
group = "${project.group}.forge"

// commitment-<version>+forge-mc<band label>.jar, and the matching sources jar.
base {
	archivesName = rootProject.name
}
def jarVersion = "${project.version}+forge-mc${project.property("forge_band_label.$band")}"
tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = jarVersion
}

// common's sources and resources are compiled into this jar (see common/build.gradle), as for Fabric.
configurations {
	commonJava {
		canBeResolved = true
		canBeConsumed = false
	}
	commonResources {
		canBeResolved = true
		canBeConsumed = false
	}
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	mavenCentral()
}

// The server GameTests (plan step C.0), as on NeoForge: Fabric's for this node, with the one GameTest import swapped
// for ours (forgelike/gametest). Declared before the one-folder-per-source-set loop below, so it gets one too.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}
configurations {
	gametestImplementation.extendsFrom implementation
	gametestRuntimeOnly.extendsFrom runtimeOnly
	serverGameTestJava {
		canBeResolved = true
		canBeConsumed = false
	}
}
def swapGameTestImports = tasks.register('swapGameTestImports', Sync) {
	from configurations.serverGameTestJava
	exclude '**/*ClientGameTest.java'
	into layout.buildDirectory.dir('generated/serverGameTests')
	// An input, so a changed swap reruns the copy: Gradle can't see inside the filter closure.
	def swap = ['import net.fabricmc.fabric.api.gametest.v1.GameTest;': 'import com.wulfic.commitment.gametest.GameTest;']
	inputs.property('importSwap', swap)
	// trim: a Windows checkout ends the line with CR.
	filter { String line -> swap.getOrDefault(line.trim(), line) }
}
sourceSets.gametest.java.srcDir(swapGameTestImports)
sourceSets.gametest.java.srcDir(rootProject.file('forgelike/gametest/java'))
sourceSets.gametest.resources.srcDir(rootProject.file('forgelike/gametest/resources'))
// The test class list GameTestDiscovery reads: Fabric's GameTest mod's fabric.mod.json.
sourceSets.gametest.resources.srcDir(rootProject.file('fabric/src/gametest/resources'))

// One run root per loader and band (see fabric/build.gradle).
def runRoot = rootProject.file("run/forge/${band}")

// Forge reads a jar's mixin configs from its manifest (the jar task, below) and a dev run's from --mixin.config: its
// mods.toml has no mixins list (../enchanting-2 gotchas, "Forge's Mixin 0.8.7").
def mixinConfigs = ['commitment.mixins.json']

minecraft {
	runs {
		register('client') {
			workingDir = new File(runRoot, "client")
		}
		register('server') {
			workingDir = new File(runRoot, "server")
			args '--nogui', '--port', project.dev_server_port
		}
		// ./gradlew :forge:<node>:runGameTest (an alias below), as on the other loaders: a GameTest server that runs
		// every server GameTest and exits. ForgeGradle makes one run task per source set; runGametestGameTestServer is
		// this one on the gametest classpath. Its world is rebuilt by every run (clearGameTestRunDir).
		register('gameTestServer') {
			workingDir = layout.buildDirectory.dir('run/gameTest').get().asFile
		}
		// Development writes its lock mirrors here, never into the developer's own user data dir (MirrorDir.OVERRIDE).
		// The GameTest server's go in its own run dir, cleared by every run (clearGameTestRunDir).
		configureEach {
			systemProperty 'commitment.mirrorDir', (name == 'gameTestServer' ? layout.buildDirectory.dir('run/gameTest/mirror').get().asFile
					: new File(runRoot, "mirror")).absolutePath
			// `-Pcommitment.unlock=start` (dev-server-smoke.sh's @gradle): the dedicated server's unlock flag (ServerGate).
			if (providers.gradleProperty('commitment.unlock').isPresent()) {
				systemProperty 'commitment.unlock', providers.gradleProperty('commitment.unlock').get()
			}
			mixinConfigs.each { args "--mixin.config=${it}" }
		}
	}
}

// Forge loads a dev mod as a Java module, which needs its classes and resources in one directory, as Forge's MDK
// sets up. Split, the resources dir holds mods.toml with no classes: "constructed 0 mods", and the run crashes.
sourceSets.each {
	def dir = layout.buildDirectory.dir("sourcesSets/${it.name}")
	it.output.resourcesDir = dir
	it.java.destinationDirectory = dir
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${band}-${forgeVersion}")

	// common's node for the same band. Compiled classes for IDEs only: the build compiles its sources, below.
	compileOnly project(common)
	commonJava project(path: common, configuration: 'commonJava')
	commonResources project(path: common, configuration: 'commonResources')
	serverGameTestJava project(path: ":fabric:${stonecutter.current.project}", configuration: 'serverGameTestJava')
}

// The dev server refuses to start without eula.txt. Written only when absent: never overwrites a file someone set.
def serverEula = new File(runRoot, "server/eula.txt")
def acceptDevServerEula = tasks.register('acceptDevServerEula') {
	doLast {
		if (!serverEula.exists()) {
			serverEula.parentFile.mkdirs()
			serverEula.text = "eula=true\n"
			logger.lifecycle("Wrote ${serverEula} for the dev server")
		}
	}
}
tasks.matching { it.name == 'runServer' }.configureEach {
	dependsOn acceptDevServerEula
	// The console has to reach the server for scripts/dev-server-smoke.sh (see neoforge/build.gradle).
	if (it instanceof JavaExec) {
		standardInput = System.in
	}
}

tasks.named('compileJava', JavaCompile) {
	dependsOn configurations.commonJava
	source configurations.commonJava
}

processResources {
	def properties = [
			version        : project.version,
			minecraftRange : project.property("forge_minecraft_range.$band"),
			forgeVersion   : forgeVersion,
			forgeMajor     : forgeVersion.tokenize('.')[0],
			packFormat     : project.property("forge_pack_format.$band"),
	]
	inputs.properties properties

	from configurations.commonResources

	// Without pack.mcmeta Forge skips the mod's data and resources (the-continent gotchas).
	filesMatching(["META-INF/mods.toml", "pack.mcmeta"]) {
		expand properties
	}
}

// The GameTest mod's data (the empty structure) needs its own pack.mcmeta, for the same reason.
tasks.named('processGametestResources', ProcessResources) {
	def packFormat = project.property("forge_pack_format.$band")
	inputs.property "packFormat", packFormat
	filesMatching("pack.mcmeta") {
		expand packFormat: packFormat
	}
}

// Same name on every loader: :forge:<node>:runGameTest. gametest-report.gradle hooks the run task itself.
ext.forge_game_test_run_task = 'runGametestGameTestServer'
tasks.register('runGameTest') {
	group = 'verification'
	description = 'Runs every server GameTest on this node (the gameTestServer run on the gametest classpath)'
	dependsOn forge_game_test_run_task
}

// A fresh GameTest world every run (see neoforge/build.gradle). Only <node>/build/run/gameTest is ever deleted.
def buildRoot = layout.buildDirectory.get().asFile.canonicalFile
def gameTestRunDir = new File(buildRoot, 'run/gameTest').canonicalFile
def clearGameTestRunDir = tasks.register('clearGameTestRunDir') {
	doLast {
		// Fail closed: only that one direct child of <node>/build/run/ is ever deleted.
		if (gameTestRunDir.parentFile != new File(buildRoot, 'run').canonicalFile || gameTestRunDir.name != 'gameTest') {
			throw new GradleException("Refusing to delete ${gameTestRunDir}: not ${buildRoot}/run/gameTest")
		}
		if (gameTestRunDir.exists()) {
			logger.lifecycle("Clearing the GameTest run dir ${gameTestRunDir} (rebuilt by every run)")
			if (!gameTestRunDir.deleteDir()) {
				throw new GradleException("Could not clear ${gameTestRunDir}; a server from the last run may still hold it")
			}
		}
		gameTestRunDir.mkdirs()
	}
}
tasks.matching { it.name == forge_game_test_run_task }.configureEach {
	dependsOn clearGameTestRunDir
}
// GameTests are part of `check`, as on the other loaders.
tasks.named('check') {
	dependsOn 'runGameTest'
}
apply from: rootProject.file('gradle/gametest-report.gradle')

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('jar', Jar) {
	manifest {
		attributes('MixinConfigs': mixinConfigs.join(','))
	}
}

tasks.named('sourcesJar', Jar) {
	dependsOn configurations.commonJava, configurations.commonResources
	from configurations.commonJava
	from configurations.commonResources
}
