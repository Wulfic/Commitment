plugins {
	id 'net.minecraftforge.gradle'
}

// This node's Minecraft band, and common's node for it.
def band = stonecutter.current.version
def common = ":common:${stonecutter.current.project}"
def forgeVersion = project.property("forge_version.$band")

// Keeps `:forge:26.2` a different module from `:common:26.2` (see common/build.gradle).
group = "${project.group}.forge"

// commitment-<version>+forge-mc<band label>.jar, and the matching sources jar.
base {
	archivesName = rootProject.name
}
def jarVersion = "${project.version}+forge-mc${project.property("forge_band_label.$band")}"
tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = jarVersion
}

// common's sources and resources are compiled into this jar (see common/build.gradle), as for Fabric.
configurations {
	commonJava {
		canBeResolved = true
		canBeConsumed = false
	}
	commonResources {
		canBeResolved = true
		canBeConsumed = false
	}
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	mavenCentral()
}

// One run root per loader and band (see fabric/build.gradle).
def runRoot = rootProject.file("run/forge/${band}")

minecraft {
	runs {
		register('client') {
			workingDir = new File(runRoot, "client")
		}
		register('server') {
			workingDir = new File(runRoot, "server")
			args '--nogui', '--port', project.dev_server_port
		}
	}
}

// Forge loads a dev mod as a Java module, which needs its classes and resources in one directory, as Forge's MDK
// sets up. Split, the resources dir holds mods.toml with no classes: "constructed 0 mods", and the run crashes.
sourceSets.each {
	def dir = layout.buildDirectory.dir("sourcesSets/${it.name}")
	it.output.resourcesDir = dir
	it.java.destinationDirectory = dir
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${band}-${forgeVersion}")

	// common's node for the same band. Compiled classes for IDEs only: the build compiles its sources, below.
	compileOnly project(common)
	commonJava project(path: common, configuration: 'commonJava')
	commonResources project(path: common, configuration: 'commonResources')
}

// The dev server refuses to start without eula.txt. Written only when absent: never overwrites a file someone set.
def serverEula = new File(runRoot, "server/eula.txt")
def acceptDevServerEula = tasks.register('acceptDevServerEula') {
	doLast {
		if (!serverEula.exists()) {
			serverEula.parentFile.mkdirs()
			serverEula.text = "eula=true\n"
			logger.lifecycle("Wrote ${serverEula} for the dev server")
		}
	}
}
tasks.matching { it.name == 'runServer' }.configureEach {
	dependsOn acceptDevServerEula
	// The console has to reach the server for scripts/dev-server-smoke.sh (see neoforge/build.gradle).
	if (it instanceof JavaExec) {
		standardInput = System.in
	}
}

tasks.named('compileJava', JavaCompile) {
	dependsOn configurations.commonJava
	source configurations.commonJava
}

processResources {
	def properties = [
			version        : project.version,
			minecraftRange : project.property("forge_minecraft_range.$band"),
			forgeVersion   : forgeVersion,
			forgeMajor     : forgeVersion.tokenize('.')[0],
			packFormat     : project.property("forge_pack_format.$band"),
	]
	inputs.properties properties

	from configurations.commonResources

	// Without pack.mcmeta Forge skips the mod's data and resources (the-continent gotchas).
	filesMatching(["META-INF/mods.toml", "pack.mcmeta"]) {
		expand properties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('sourcesJar', Jar) {
	dependsOn configurations.commonJava, configurations.commonResources
	from configurations.commonJava
	from configurations.commonResources
}
