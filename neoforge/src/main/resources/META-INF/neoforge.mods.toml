modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "commitment"
version = "${version}"
displayName = "Commitment"
authors = "wulfic"
${iconKey} = "assets/commitment/icon.png"
description = '''
Commit a world to the mods, resource packs and config it was played with. Changing them later takes a 24-hour unlock.
'''

# NeoForge reads its mixin configs from here; Forge reads them from the jar manifest (forge/build.gradle).
[[mixins]]
config = "commitment.mixins.json"

[[dependencies.commitment]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforgeFloor},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.commitment]]
modId = "minecraft"
type = "required"
versionRange = "${minecraftRange}"
ordering = "NONE"
side = "BOTH"
